name: 🐛 Bug report / 缺陷报告
description: Report a reproducible problem. 报告可复现的问题。
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve AntiFraudBot. Please remove all tokens, QQ IDs, and private logs before submitting.
  - type: textarea
    id: description
    attributes:
      label: Problem / 问题描述
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction / 复现步骤
      placeholder: "1. Configure ...\n2. Run ...\n3. Observe ..."
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit / 版本或提交
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform / 平台
      options: [Windows, Linux, macOS, Docker or container, Other]
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs / 已脱敏日志
      render: shell
