[project]
name = "antifraudbot"
version = "0.1.0"
description = "基于 NoneBot2 和 OneBot 11 的智能反诈机器人与安全数据平台"
authors = [{ name = "ITSevin" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.9,<4.0"
dependencies = [
    "nonebot-adapter-onebot>=2.4.6",
    "nonebot2[fastapi]>=2.4.1",
    "nb-cli>=1.4.2",
    "httpx>=0.28.1",
    "nonebot-plugin-apscheduler>=0.5.0",
    "ujson>=5.10.0",
    "pydantic==1.10.21",
    "alibabacloud-green20220302==2.2.0",
    "nonebot-plugin-orm[sqlite]>=0.8.3,<0.9.0",
    "python-jose[cryptography]>=3.3.0,<4.0.0",
    "python-multipart>=0.0.9,<0.0.10",
    "uvicorn>=0.39.0",
]

[tool.poetry]
package-mode = false

[tool.nonebot]
adapters = [
    { name = "OneBot V11", module_name = "nonebot.adapters.onebot.v11" }
]
plugins = ["nonebot_plugin_apscheduler"]
plugin_dirs = ["src/plugins"]
builtin_plugins = []

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0.0"
ruff = ">=0.12.0"

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
